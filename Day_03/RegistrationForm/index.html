<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Form validation</title>
</head>

<body>
  <div class="container">
    <div class="box">
      <header id="signup-header"></header>
      <h1>Sign up</h1>
      <main class="signup-body">
        <form id="signupForm">
          <p>
            <label for="name">Full Name</label>
            <input type="text" placeholder="Your Name" id="name">
            <span id="nameError"></span>
          </p>

          <p>
            <label for="email">Email</label>
            <input type="email" placeholder="useremail@mail.com" id="email">
            <span id="emailError"></span>
          </p>

          <p>
            <label for="password">Password</label>
            <input type="password" placeholder="8 characters at least" id="password">
            <span id="passError"></span>
          </p>

          <p>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" placeholder="Confirm Password" id="confirmPassword">
            <span id="confirmPassError"></span>
          </p>

          <p>
            <input type="submit" value="Create Account" id="submitBtn">
          </p>
        </form>
      </main>
      <footer class="signup-footer">
        <p>Already have account? <a href="#">login</a></p>
      </footer>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
